[package]
name = "vault-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vault session orchestration: login, unlock, sync, CRUD"

[features]
default = []
# macOS Touch ID unlock (stub — see src/biometric.rs).
biometric = []
# WebAuthn / FIDO2 2FA scaffolding (CTAP-HID framing; see src/webauthn.rs).
webauthn = []

[dependencies]
vault-crypto.workspace = true
vault-api.workspace = true
anyhow.workspace = true
arboard.workspace = true
chrono.workspace = true
directories.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
totp-rs.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
url.workspace = true
base64.workspace = true
keyring.workspace = true
reqwest.workspace = true
sha1.workspace = true
hex.workspace = true
hkdf.workspace = true
argon2.workspace = true
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
rsa.workspace = true
regex.workspace = true
ssh-key.workspace = true
zxcvbn.workspace = true
csv.workspace = true
roxmltree.workspace = true
zip.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { workspace = true }
tempfile = "3"
